<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuickNotes</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <main class="container">
    <header>
      <p class="eyebrow">QUICKNOTES</p>
      <h1>Your notes, in one place</h1>
      <p class="intro">A small API client for creating, loading, and deleting notes.</p>
    </header>

    <section class="panel" aria-labelledby="create-heading">
      <h2 id="create-heading">Create a note</h2>
      <form id="note-form">
        <label for="title-input">Title <span aria-hidden="true">*</span></label>
        <input id="title-input" name="title" type="text" maxlength="100"
               placeholder="e.g. Ideas for this week" required>
        <p class="hint">Required, up to 100 characters.</p>

        <label for="body-input">Note body</label>
        <textarea id="body-input" name="body" rows="4"
                  placeholder="Write your note (optional)"></textarea>
        <button id="submit-btn" type="submit">Create note</button>
      </form>
    </section>

    <section class="notes-section" aria-labelledby="notes-heading">
      <div class="section-heading">
        <div>
          <h2 id="notes-heading">Your notes</h2>
          <p class="muted">Load example notes from the practice API.</p>
        </div>
        <button id="load-btn" type="button" class="secondary">Load notes</button>
      </div>
      <p id="status" class="status" role="status" aria-live="polite">Ready. Load notes to begin.</p>
      <ul id="notes-list" aria-live="polite"></ul>
    </section>
    <footer>Practice project · JSONPlaceholder demo API</footer>
  </main>
</body>
</html>
